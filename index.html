<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below (see src/themes.css).
-->
<html lang="en" data-theme="gc-lab">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>GC Lab</title>
    <!--
      First-paint background: the browser shows this color until the CSS
      bundle arrives, so there is no white flash. Keep it equal to
      --color-background in src/themes.css.
    -->
    <style>
      html { background-color: #0b1015; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
